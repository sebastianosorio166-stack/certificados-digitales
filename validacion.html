<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Validación de Documentos</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="styles.css">

</head>

<body onload="cargarValidaciones()">

<!-- NAVBAR -->

<nav class="navbar navbar-dark bg-primary">

<div class="container-fluid">

<span class="navbar-brand">
Validación Documental
</span>

<a href="dashboard.html" class="btn btn-light btn-sm">
Volver
</a>

</div>

</nav>

<!-- CONTENIDO -->

<div class="container mt-4">

<h2 class="mb-4">
Panel de Validación de Solicitudes
</h2>

<div id="contenedorValidaciones">

</div>

</div>

<script src="script.js"></script>

<script>

// ===============================
// CARGAR VALIDACIONES
// ===============================

function cargarValidaciones() {

let usuarios =
JSON.parse(localStorage.getItem("usuarios")) || [];

let contenedor =
document.getElementById("contenedorValidaciones");

contenedor.innerHTML = "";

let pendientes =
usuarios.filter(u =>
u.estadoCertificado === "Pendiente"
);

if (pendientes.length === 0) {

contenedor.innerHTML = `

<div class="alert alert-success">

No existen solicitudes pendientes.

</div>

`;

return;

}

pendientes.forEach((usuario, index) => {

contenedor.innerHTML += `

<div class="card shadow p-4 mb-4">

<h4 class="text-primary mb-3">
Solicitud de ${usuario.nombres} ${usuario.apellidos}
</h4>

<div class="row">

<div class="col-md-6">

<p>
<strong>Cédula:</strong>
${usuario.cedula}
</p>

<p>
<strong>Celular:</strong>
${usuario.celular}
</p>

<p>
<strong>Correo:</strong>
${usuario.correo}
</p>

</div>

<div class="col-md-6">

<div class="form-check">
<input class="form-check-input" type="checkbox" id="doc1${index}">
<label class="form-check-label">
Documento de identidad válido
</label>
</div>

<div class="form-check">
<input class="form-check-input" type="checkbox" id="doc2${index}">
<label class="form-check-label">
Datos personales verificados
</label>
</div>

<div class="form-check">
<input class="form-check-input" type="checkbox" id="doc3${index}">
<label class="form-check-label">
Correo electrónico validado
</label>
</div>

<div class="form-check">
<input class="form-check-input" type="checkbox" id="doc4${index}">
<label class="form-check-label">
Número celular confirmado
</label>
</div>

</div>

</div>

<div class="mt-4">

<div class="row">

<div class="col-md-4 mb-2">

<select id="rolValidacion${index}" class="form-select">

<option value="usuario">
Usuario
</option>

<option value="admin">
Administrador
</option>

</select>

</div>

<div class="col-md-4 mb-2">

<select id="vigenciaValidacion${index}" class="form-select">

<option value="1 año">
1 año
</option>

<option value="2 años">
2 años
</option>

<option value="3 años">
3 años
</option>

</select>

</div>

</div>

<div class="mt-3">

<button
class="btn btn-success"
onclick="aprobarDesdeValidacion(${index})">

Aprobar Solicitud

</button>

<button
class="btn btn-danger"
onclick="rechazarDesdeValidacion(${index})">

Rechazar Solicitud

</button>

</div>

</div>

</div>

`;

});

}

// ===============================
// APROBAR DESDE VALIDACIÓN
// ===============================

function aprobarDesdeValidacion(indexPendiente) {

let usuarios =
JSON.parse(localStorage.getItem("usuarios")) || [];

let pendientes =
usuarios.filter(u =>
u.estadoCertificado === "Pendiente"
);

let usuarioPendiente =
pendientes[indexPendiente];

let indexReal =
usuarios.findIndex(u =>
u.cedula === usuarioPendiente.cedula
);

// VALIDAR CHECKS

let checks = [

document.getElementById(`doc1${indexPendiente}`).checked,
document.getElementById(`doc2${indexPendiente}`).checked,
document.getElementById(`doc3${indexPendiente}`).checked,
document.getElementById(`doc4${indexPendiente}`).checked

];

let completos = checks.every(c => c === true);

if (!completos) {

alert("Debe validar todos los documentos");

return;

}

// ROL Y VIGENCIA

let rol =
document.getElementById(`rolValidacion${indexPendiente}`).value;

let vigencia =
document.getElementById(`vigenciaValidacion${indexPendiente}`).value;

// FECHAS

let fechaActual = new Date();

let fechaEmision =
fechaActual.toLocaleDateString();

let años =
parseInt(vigencia);

fechaActual.setFullYear(
fechaActual.getFullYear() + años
);

let fechaCaducidad =
fechaActual.toLocaleDateString();

// ACTUALIZAR USUARIO

usuarios[indexReal].rol = rol;

usuarios[indexReal].estadoCertificado = "Aprobado";

usuarios[indexReal].vigencia = vigencia;

usuarios[indexReal].fechaEmision = fechaEmision;

usuarios[indexReal].fechaCaducidad = fechaCaducidad;

usuarios[indexReal].solicitudPendiente = false;

// HISTORIAL CERTIFICADOS

usuarios[indexReal].historialCertificados.push({

nombre:
usuarios[indexReal].nombres + " " +
usuarios[indexReal].apellidos,

cedula:
usuarios[indexReal].cedula,

fechaEmision,
fechaCaducidad

});

// HISTORIAL VALIDACIONES

usuarios[indexReal].historialValidaciones.push({

admin: "Admin",

accion: "Aprobado",

fecha:
new Date().toLocaleString(),

observacion:
"Documentación validada correctamente"

});

localStorage.setItem(
"usuarios",
JSON.stringify(usuarios)
);

alert("Solicitud aprobada");

location.reload();

}

// ===============================
// RECHAZAR DESDE VALIDACIÓN
// ===============================

function rechazarDesdeValidacion(indexPendiente) {

let motivo =
prompt("Ingrese motivo del rechazo");

if (!motivo) return;

let usuarios =
JSON.parse(localStorage.getItem("usuarios")) || [];

let pendientes =
usuarios.filter(u =>
u.estadoCertificado === "Pendiente"
);

let usuarioPendiente =
pendientes[indexPendiente];

let indexReal =
usuarios.findIndex(u =>
u.cedula === usuarioPendiente.cedula
);

// ACTUALIZAR

usuarios[indexReal].estadoCertificado =
"Rechazado";

usuarios[indexReal].solicitudPendiente =
false;

// HISTORIAL VALIDACIONES

usuarios[indexReal].historialValidaciones.push({

admin: "Admin",

accion: "Rechazado",

fecha:
new Date().toLocaleString(),

observacion: motivo

});

localStorage.setItem(
"usuarios",
JSON.stringify(usuarios)
);

alert("Solicitud rechazada");

location.reload();

}

</script>

</body>
</html>
