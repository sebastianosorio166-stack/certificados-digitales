<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<title>Dashboard</title>
<link rel="stylesheet" href="styles.css">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body>

<nav class="navbar navbar-dark bg-primary">
<div class="container-fluid">
<span class="navbar-brand">Panel Administrador</span>
<button onclick="cerrarSesion()" class="btn btn-light btn-sm">Cerrar sesión</button>
</div>
</nav>

<div class="container mt-4">

<h3>Dashboard</h3>
<p class="text-muted">Gestión del sistema</p>

<div class="row g-4 mt-3">

<!-- VALIDACIÓN -->
<div class="col-md-6">
<div class="card shadow text-center p-4">
<h5>Validación de documentos</h5>
<p>Revisión de documentos de usuarios</p>
<button class="btn btn-primary" onclick="location.href='validacion.html'">
Ingresar
</button>
</div>
</div>

<!-- ADMIN PERFILES -->
<div class="col-md-6">
<div class="card shadow text-center p-4">
<h5>Administrar perfiles</h5>
<p>Asignación de roles</p>
<button class="btn btn-primary" onclick="location.href='admin.html'">
Ingresar
</button>
</div>
</div>

</div>

</div>

<script>

/* PROTECCIÓN: SOLO ADMIN */
let rol = localStorage.getItem("rol");

if(rol !== "admin"){
    alert("Acceso no autorizado");
    window.location.href = "index.html";
}

/* CERRAR SESIÓN */
function cerrarSesion(){
    
    window.location.href = "index.html";
}

</script>

</body>
</html>
