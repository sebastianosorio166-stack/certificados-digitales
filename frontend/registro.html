<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Crear cuenta | Certificados digitales</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="register" class="bg-light">
  <main class="container py-5">
    <section class="card shadow-sm mx-auto p-4" style="max-width: 620px">
      <h1 class="h3 mb-4">Crear cuenta</h1>
      <div id="message" hidden></div>
      <form id="registerForm" class="row g-3">
        <div class="col-md-6"><label class="form-label" for="nombres">Nombres</label><input class="form-control" id="nombres" name="nombres" required></div>
        <div class="col-md-6"><label class="form-label" for="apellidos">Apellidos</label><input class="form-control" id="apellidos" name="apellidos" required></div>
        <div class="col-md-6"><label class="form-label" for="documento">Documento</label><input class="form-control" id="documento" name="documento" required></div>
        <div class="col-md-6"><label class="form-label" for="telefono">Teléfono</label><input class="form-control" id="telefono" name="telefono"></div>
        <div class="col-12"><label class="form-label" for="correo">Correo electrónico</label><input class="form-control" id="correo" name="correo" type="email" required></div>
        <div class="col-12"><label class="form-label" for="password">Contraseña</label><input class="form-control" id="password" name="password" type="password" minlength="8" required></div>
        <div class="col-12 d-flex gap-2"><button class="btn btn-primary" type="submit">Registrarme</button><a class="btn btn-outline-secondary" href="index.html">Volver</a></div>
      </form>
    </section>
  </main>
  <script src="js/script.js"></script>
</body>
</html>
