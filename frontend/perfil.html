<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mi perfil | Certificados digitales</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="profile" class="bg-light">
  <nav class="navbar navbar-dark bg-primary"><div class="container"><span class="navbar-brand">Certificados digitales</span><button class="btn btn-light btn-sm" data-logout>Cerrar sesión</button></div></nav>
  <main class="container py-4">
    <div id="message" hidden></div>
    <h1 class="h3">Mi perfil</h1><p><strong id="userName"></strong> · Documento: <span id="documento"></span></p>
    <div class="row g-4">
      <section class="col-lg-5"><div class="card shadow-sm p-4"><h2 class="h5">Datos de contacto</h2>
        <form id="profileForm" class="row g-3"><div class="col-12"><label class="form-label" for="nombres">Nombres</label><input class="form-control" id="nombres" name="nombres" required></div><div class="col-12"><label class="form-label" for="apellidos">Apellidos</label><input class="form-control" id="apellidos" name="apellidos" required></div><div class="col-12"><label class="form-label" for="correo">Correo</label><input class="form-control" id="correo" name="correo" type="email" required></div><div class="col-12"><label class="form-label" for="telefono">Teléfono</label><input class="form-control" id="telefono" name="telefono"></div><div class="col-12"><button class="btn btn-primary">Guardar cambios</button></div></form>
      </div></section>
      <section class="col-lg-7"><div class="card shadow-sm p-4 mb-4"><h2 class="h5">Solicitar certificado o renovación</h2><form id="requestForm"><label class="form-label" for="observaciones">Observaciones (opcional)</label><textarea class="form-control mb-3" id="observaciones" name="observaciones" rows="3"></textarea><button class="btn btn-success">Enviar solicitud</button></form></div>
      <div class="card shadow-sm p-4"><h2 class="h5">Mis solicitudes</h2><div class="table-responsive"><table class="table"><thead><tr><th>Fecha</th><th>Estado</th><th>Observación</th></tr></thead><tbody id="solicitudes"></tbody></table></div><h2 class="h5 mt-4">Mis certificados</h2><div class="table-responsive"><table class="table"><thead><tr><th>Código</th><th>Emisión</th><th>Vencimiento</th><th>Estado</th></tr></thead><tbody id="certificados"></tbody></table></div></div></section>
    </div>
  </main><script src="js/script.js"></script>
</body></html>
