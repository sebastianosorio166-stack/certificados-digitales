<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Certificados digitales | Ingreso</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="login" class="bg-light">
  <main class="login-container">
    <section class="login-box">
      <h1 class="h3 mb-4">Certificados digitales</h1>
      <div id="message" hidden></div>
      <form id="loginForm">
        <label class="visually-hidden" for="documento">Documento</label>
        <input id="documento" name="documento" class="form-control" autocomplete="username" placeholder="Número de documento" required>
        <label class="visually-hidden" for="password">Contraseña</label>
        <input id="password" name="password" class="form-control" type="password" autocomplete="current-password" placeholder="Contraseña" required>
        <button class="btn btn-primary mt-3" type="submit">Ingresar</button>
      </form>
      <p class="registro-link mb-0">¿No tienes cuenta? <a href="registro.html">Regístrate</a></p>
    </section>
  </main>
  <script src="js/script.js"></script>
</body>
</html>
